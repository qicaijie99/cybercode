<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="preload" as="image" href="/app-icon.png" />
    <link rel="preload" as="image" href="/brand/cybercode-wordmark-long-flat-v4.png" />
    <title>CyberCode</title>
    <script>
      try {
        const theme = localStorage.getItem('cybercode-theme') === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <style>
      :root {
        --boot-background: #f8f9fa;
        --boot-surface: #ffffff;
        --boot-border: rgba(0, 0, 0, 0.08);
        --boot-shadow: rgba(29, 29, 31, 0.14);
      }

      :root[data-theme="dark"] {
        --boot-background: #111315;
        --boot-surface: #0f1114;
        --boot-border: rgba(244, 244, 245, 0.13);
        --boot-shadow: rgba(0, 0, 0, 0.34);
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--boot-background);
      }

      .boot-splash {
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        opacity: 1;
        background: var(--boot-background);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        isolation: isolate;
        user-select: none;
        -webkit-user-select: none;
        -webkit-app-region: drag;
      }

      .boot-splash.boot-splash-exit {
        display: none;
        pointer-events: none;
      }

      .boot-splash-brand {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .boot-splash-wordmark-frame {
        visibility: hidden;
      }

      .boot-splash.boot-splash-assets-ready .boot-splash-wordmark-frame {
        visibility: visible;
      }

      .boot-splash-logo-frame {
        position: relative;
        width: 112px;
        height: 112px;
        overflow: hidden;
        border: 1px solid var(--boot-border);
        border-radius: 28px;
        background: var(--boot-surface);
        box-shadow: 0 18px 48px var(--boot-shadow);
        visibility: hidden;
      }

      .boot-splash.boot-splash-assets-ready .boot-splash-logo-frame {
        visibility: visible;
      }

      .boot-splash-logo {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }

      .boot-splash-wordmark-frame {
        position: relative;
        width: 240px;
        height: 50px;
        margin-top: 18px;
        overflow: hidden;
      }

      .boot-splash-wordmark {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }

      .boot-splash-wordmark-dark {
        display: none;
      }

      :root[data-theme="dark"] .boot-splash-wordmark-light {
        display: none;
      }

      :root[data-theme="dark"] .boot-splash-wordmark-dark {
        display: block;
      }

      .boot-splash-wordmark-shine {
        position: absolute;
        z-index: 1;
        inset: 0;
        overflow: hidden;
        -webkit-mask: url('/brand/cybercode-wordmark-long-flat-v4.png') center / contain no-repeat;
        mask: url('/brand/cybercode-wordmark-long-flat-v4.png') center / contain no-repeat;
        pointer-events: none;
      }

      .boot-splash-wordmark-shine-beam {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 62%;
        background: linear-gradient(108deg, transparent 0%, rgba(255, 255, 255, 0.18) 22%, rgba(255, 255, 255, 0.96) 45%, rgba(73, 211, 255, 0.58) 55%, transparent 75%);
        transform: translateX(-120%);
        opacity: 0;
        will-change: transform;
      }

      .boot-splash.boot-splash-assets-ready .boot-splash-wordmark-shine-beam {
        animation: boot-wordmark-shine-sweep 2.6s cubic-bezier(0.45, 0, 0.2, 1) 300ms infinite;
      }

      @keyframes boot-wordmark-shine-sweep {
        0% { transform: translateX(-120%); opacity: 0; }
        6% { opacity: 1; }
        42% { transform: translateX(290%); opacity: 1; }
        48%, 100% { transform: translateX(290%); opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-splash-wordmark-shine {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" class="boot-splash" role="status" aria-label="Loading CyberCode">
      <div class="boot-splash-brand" aria-hidden="true">
        <div class="boot-splash-logo-frame">
          <img class="boot-splash-logo" src="/app-icon.png" alt="" draggable="false" decoding="async" fetchpriority="high" />
        </div>
        <div class="boot-splash-wordmark-frame">
          <img class="boot-splash-wordmark boot-splash-wordmark-light" src="/brand/cybercode-wordmark-long-flat-v4.png" alt="" draggable="false" decoding="async" fetchpriority="high" />
          <img class="boot-splash-wordmark boot-splash-wordmark-dark" src="/brand/cybercode-wordmark-long-flat-v4-dark.png" alt="" draggable="false" decoding="async" fetchpriority="high" />
          <span class="boot-splash-wordmark-shine"><span class="boot-splash-wordmark-shine-beam"></span></span>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const splash = document.getElementById('boot-splash')
        if (!splash) return

        const waitForImage = async (image) => {
          if (!image.complete) {
            await new Promise((resolve) => {
              image.addEventListener('load', resolve, { once: true })
              image.addEventListener('error', resolve, { once: true })
            })
          }

          if (image.naturalWidth > 0 && typeof image.decode === 'function') {
            try {
              await image.decode()
            } catch {
              // The load event already confirmed the local asset is available.
            }
          }
        }

        const images = Array.from(splash.querySelectorAll('img'))
        Promise.all(images.map(waitForImage)).then(() => {
          splash.classList.add('boot-splash-assets-ready')
        })
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
